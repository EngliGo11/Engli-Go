<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - Sign up</title>

    <link rel="icon" href="IMG/logo.png">

    <link rel="stylesheet" href="CSS/login.css">
</head>

<body>

    <div class="login-card-container">

    <div class="login-card">
        <h2>Sign up here.</h2>
        <p>Enter your details to register.</p>

        <form id="register-form" onsubmit="handleRegister(event)">

            <div class="input-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" placeholder="Ej. Pepito Peréz" required>
            </div>

            <div class="input-group">
                <label for="reg-email">Gmail</label>
                <input type="email" id="reg-email" placeholder="user@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn-login">Sign up</button>

            <div class="signup-link">
                ¿You already have an account.?
                <a href="login.html">Log in here</a>
            </div>

        </form>
    </div>
    </div>

    <script src="JavaScript/registro.js"></script>

</body>
</html>
